services:
  cognee:
    image: cognee/cognee:1.4.2
    restart: always
    # Neo4j handles concurrent access; multiple workers parallelize the blocking
    # remember/entry path. entrypoint.sh hardcodes -w 1, so bypass it.
    entrypoint: ["/app/.venv/bin/gunicorn"]
    command: ["-w", "4", "-k", "uvicorn.workers.UvicornWorker", "-t", "30000", "--bind=0.0.0.0:8000", "--log-level", "error", "--access-logfile", "-", "--error-logfile", "-", "cognee.api.client:app"]
    environment:
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - REQUIRE_AUTHENTICATION=true
      # Preflight connection test times out against cloud endpoints; skip it
      - COGNEE_SKIP_CONNECTION_TEST=true
      # LLM: DeepSeek V4 Flash via OpenRouter, provider-pinned to DeepSeek hosting
      - LLM_PROVIDER=custom
      - LLM_MODEL=openrouter/deepseek/deepseek-v4-flash-0731
      - LLM_ENDPOINT=http://llm-proxy:8000/v1
      - LLM_API_KEY=${LLM_API_KEY}
      # Embeddings: Voyage AI voyage-4-large via the param-stripping sidecar
      - EMBEDDING_PROVIDER=openai_compatible
      - EMBEDDING_ENDPOINT=http://voyage-proxy:8000/v1
      - EMBEDDING_MODEL=voyage-4-large
      - EMBEDDING_API_KEY=${VOYAGE_API_KEY}
      - EMBEDDING_DIMENSIONS=1024
      # Postgres for relational + pgvector; Kuzu (file-based) for the graph
      - DB_PROVIDER=postgres
      - DB_HOST=cognee-postgres
      - DB_PORT=5432
      - DB_NAME=cognee_db
      - DB_USERNAME=cognee
      - DB_PASSWORD=${DB_PASSWORD}
      - VECTOR_DB_PROVIDER=pgvector
      - VECTOR_DB_HOST=cognee-postgres
      - VECTOR_DB_PORT=5432
      - VECTOR_DB_NAME=cognee_db
      - VECTOR_DB_USERNAME=cognee
      - VECTOR_DB_PASSWORD=${DB_PASSWORD}
      - GRAPH_DATABASE_PROVIDER=neo4j
      - GRAPH_DATABASE_URL=bolt://neo4j:7687
      - GRAPH_DATABASE_USERNAME=neo4j
      - GRAPH_DATABASE_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - /srv/cognee/data:/app/cognee/.cognee_system
      - /srv/cognee/data-storage:/app/cognee/.data_storage
    depends_on:
      cognee-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  neo4j:
    image: neo4j:5.26
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - /srv/cognee/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  voyage-proxy:
    build: ./voyage-proxy
    restart: always
    environment:
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}

  llm-proxy:
    build: ./llm-proxy
    restart: always
    environment:
      - LLM_API_KEY=${LLM_API_KEY}

  cognee-postgres:
    image: pgvector/pgvector:pg17
    restart: always
    # 4 gunicorn workers + improve pipelines exhaust the 100-connection default
    command: postgres -c max_connections=300
    environment:
      - POSTGRES_USER=cognee
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cognee_db
    volumes:
      - /srv/cognee/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 5s
      timeout: 5s
      retries: 5
